<!DOCTYPE html>
<html>
<head>
  <title>SignBridge+ Model Tester</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { background:#0a0e17; color:#e2e8f0; font-family:'Segoe UI', monospace; min-height:100vh; }

    #topbar { background:#111827; border-bottom:1px solid #1e2d45; padding:12px 24px; display:flex; align-items:center; justify-content:space-between; }
    #topbar h1 { font-size:1.1rem; color:#00e5ff; letter-spacing:0.1em; }
    #topbar span { font-size:0.75rem; color:#4b6280; }

    #main { display:grid; grid-template-columns: 1fr 380px; gap:0; height:calc(100vh - 50px); }

    /* Camera */
    #cam-wrap { position:relative; background:#060910; display:flex; align-items:center; justify-content:center; overflow:hidden; }
    #cam-feed { width:100%; height:100%; object-fit:cover; }

    /* Right Panel */
    #panel { background:#111827; border-left:1px solid #1e2d45; display:flex; flex-direction:column; overflow:hidden; }

    .panel-section { padding:16px; border-bottom:1px solid #1e2d45; }
    .section-label { font-size:0.65rem; letter-spacing:0.2em; text-transform:uppercase; color:#4b6280; margin-bottom:10px; }

    /* Current Sign */
    #current-sign { font-size:2.5rem; font-weight:700; color:#00e5ff; text-align:center; min-height:60px; line-height:1; transition:all 0.2s; }
    #current-sign.detected { color:#10b981; }
    #conf-bar-wrap { background:#1e2d45; border-radius:999px; height:8px; margin:10px 0 4px; overflow:hidden; }
    #conf-bar { height:100%; background:linear-gradient(90deg,#00e5ff,#7c3aed); border-radius:999px; transition:width 0.3s ease; width:0%; }
    #conf-label { font-size:0.75rem; color:#4b6280; text-align:right; }

    /* Sentence */
    #sentence-box { background:#0d1117; border:1px solid #1e2d45; border-radius:10px; padding:12px; min-height:60px; font-size:1rem; color:#e2e8f0; line-height:1.6; word-wrap:break-word; flex:1; }
    .word-chip { display:inline-block; background:rgba(0,229,255,0.1); border:1px solid rgba(0,229,255,0.2); color:#00e5ff; border-radius:6px; padding:2px 8px; margin:2px; font-size:0.9rem; }

    #clear-btn { width:100%; padding:10px; background:rgba(239,68,68,0.1); border:1px solid rgba(239,68,68,0.3); color:#f87171; border-radius:8px; cursor:pointer; font-family:monospace; font-size:0.85rem; margin-top:10px; transition:all 0.2s; }
    #clear-btn:hover { background:rgba(239,68,68,0.2); }

    /* History */
    #history-list { flex:1; overflow-y:auto; padding:0 16px 16px; display:flex; flex-direction:column; gap:6px; }
    .history-item { background:#0d1117; border:1px solid #1e2d45; border-radius:8px; padding:8px 12px; display:flex; justify-content:space-between; align-items:center; animation:slideIn 0.3s ease; }
    @keyframes slideIn { from{opacity:0;transform:translateY(-8px)} to{opacity:1;transform:translateY(0)} }
    .history-sign { font-size:0.9rem; color:#e2e8f0; font-weight:600; }
    .history-conf { font-size:0.72rem; font-family:monospace; }
    .history-conf.high { color:#10b981; }
    .history-conf.mid  { color:#f59e0b; }
    .history-conf.low  { color:#ef4444; }

    /* Signs list */
    #signs-grid { display:flex; flex-wrap:wrap; gap:6px; padding:16px; border-bottom:1px solid #1e2d45; }
    .sign-badge { font-size:0.7rem; padding:3px 10px; border-radius:999px; background:#1e2d45; color:#4b6280; border:1px solid #1e2d45; transition:all 0.2s; }
    .sign-badge.active { background:rgba(0,229,255,0.15); color:#00e5ff; border-color:rgba(0,229,255,0.4); transform:scale(1.05); }
  </style>
</head>
<body>

<div id="topbar">
  <h1>🤟 SignBridge+ Model Tester</h1>
  <span id="status-dot">● Connecting...</span>
</div>

<div id="main">
  <div id="cam-wrap">
    <img id="cam-feed" src="/video_feed"/>
  </div>

  <div id="panel">
    <!-- Current Sign -->
    <div class="panel-section">
      <div class="section-label">Current Detection</div>
      <div id="current-sign">...</div>
      <div id="conf-bar-wrap"><div id="conf-bar"></div></div>
      <div id="conf-label">0% confidence</div>
    </div>

    <!-- Supported Signs -->
    <div id="signs-grid" class="panel-section">
      <div class="section-label" style="width:100%">Supported Signs</div>
    </div>

    <!-- Sentence -->
    <div class="panel-section" style="flex:1;display:flex;flex-direction:column;">
      <div class="section-label">Sentence Buffer</div>
      <div id="sentence-box">Waiting for signs...</div>
      <button id="clear-btn" onclick="clearSentence()">🗑 Clear Sentence</button>
    </div>

    <!-- History -->
    <div class="section-label" style="padding:12px 16px 6px">Detection History</div>
    <div id="history-list"></div>
  </div>
</div>

<script>
  const SIGNS = [];

  // Fetch signs from first prediction and populate badges
  function initSigns(signs) {
    const grid = document.getElementById('signs-grid');
    // Remove old badges
    grid.querySelectorAll('.sign-badge').forEach(e => e.remove());
    signs.forEach(sign => {
      const b = document.createElement('span');
      b.className = 'sign-badge';
      b.id = 'badge-' + sign;
      b.textContent = sign.replace('_', ' ');
      grid.appendChild(b);
      SIGNS.push(sign);
    });
  }

  let lastSign = '';
  let knownSigns = [];

  async function fetchPrediction() {
    try {
      const res  = await fetch('/prediction');
      const data = await res.json();

      document.getElementById('status-dot').textContent = '● Live';
      document.getElementById('status-dot').style.color = '#10b981';

      // Init signs badges on first load
      if (knownSigns.length === 0 && data.history.length > 0) {
        // Already initialized below
      }

      // Current sign
      const signEl = document.getElementById('current-sign');
      const conf   = data.confidence;
      const sign   = data.sign;

      if (sign) {
        signEl.textContent = sign.replace(/_/g, ' ').toUpperCase();
        signEl.classList.add('detected');
      } else {
        signEl.textContent = '...';
        signEl.classList.remove('detected');
      }

      // Confidence bar
      document.getElementById('conf-bar').style.width = conf + '%';
      document.getElementById('conf-label').textContent = conf + '% confidence';

      // Highlight active badge
      document.querySelectorAll('.sign-badge').forEach(b => b.classList.remove('active'));
      if (sign) {
        const active = document.getElementById('badge-' + sign);
        if (active) active.classList.add('active');
      }

      // Sentence
      const sentEl = document.getElementById('sentence-box');
      if (data.sentence.length > 0) {
        sentEl.innerHTML = data.sentence.map(w =>
          `<span class="word-chip">${w.replace(/_/g,' ')}</span>`
        ).join(' ');
      } else {
        sentEl.innerHTML = '<span style="color:#4b6280">Waiting for signs...</span>';
      }

      // History
      const histEl = document.getElementById('history-list');
      histEl.innerHTML = data.history.map(h => {
        const cls = h.confidence > 80 ? 'high' : h.confidence > 60 ? 'mid' : 'low';
        return `<div class="history-item">
          <span class="history-sign">${h.sign.replace(/_/g,' ')}</span>
          <span class="history-conf ${cls}">${h.confidence}%</span>
        </div>`;
      }).join('');

    } catch(e) {
      document.getElementById('status-dot').textContent = '● Disconnected';
      document.getElementById('status-dot').style.color = '#ef4444';
    }
  }

  async function clearSentence() {
    await fetch('/clear', { method: 'POST' });
  }

  // Init sign badges from SIGNS in Python
  fetch('/prediction').then(r => r.json()).then(data => {
    // We'll get signs from the model's known labels
  });

  // Poll every 200ms
  setInterval(fetchPrediction, 200);
  fetchPrediction();

  // Init badges manually
  const SIGN_LIST = ["pamilya", "lola", "lolo", "mama", "papa"];
  SIGN_LIST.forEach(sign => {
    const grid = document.getElementById('signs-grid');
    const b = document.createElement('span');
    b.className = 'sign-badge';
    b.id = 'badge-' + sign;
    b.textContent = sign.replace(/_/g, ' ');
    grid.appendChild(b);
  });
</script>
</body>
</html>
