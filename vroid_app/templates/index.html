<!DOCTYPE html>
<html>
<head>
  <title>SignBridge+ VRoid</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { background:#0d1117; display:flex; flex-direction:column; height:100vh; font-family:monospace; color:white; overflow:hidden; }
    
    #topbar { background:#111820; border-bottom:1px solid #1c2a3a; padding:10px 20px; display:flex; align-items:center; gap:16px; }
    #topbar h1 { font-size:1rem; color:#00e5ff; letter-spacing:0.1em; }
    #loadBtn { background:#00e5ff; color:#000; border:none; padding:7px 16px; border-radius:8px; cursor:pointer; font-weight:bold; font-family:monospace; font-size:0.8rem; }
    #status { font-size:0.72rem; color:#4b6280; margin-left:auto; }
    
    #main { display:flex; flex:1; overflow:hidden; }
    #vrm-wrap { flex:1; position:relative; display:flex; align-items:center; justify-content:center; background:#0d1117; }
    #canvas { display:block; }
    #translation { position:absolute; bottom:24px; left:50%; transform:translateX(-50%); background:rgba(0,0,0,0.75); padding:10px 24px; border-radius:12px; font-size:1.1rem; color:#00e5ff; border:1px solid rgba(0,229,255,0.25); white-space:nowrap; }
    
    #cam-panel { width:320px; background:#111820; border-left:1px solid #1c2a3a; display:flex; flex-direction:column; flex-shrink:0; }
    #bones-panel { width:300px; background:#111820; border-right:1px solid #1c2a3a; display:flex; flex-direction:column; flex-shrink:0; }
    #bones-header { padding:10px 14px; border-bottom:1px solid #1c2a3a; font-size:0.7rem; letter-spacing:0.15em; text-transform:uppercase; color:#4b6280; }
    #bones-list { padding:10px 14px; flex:1; display:flex; flex-direction:column; gap:4px; overflow-y:auto; font-size:0.6rem; color:#4b6280; line-height:1.4; }
    #cam-header { padding:10px 14px; border-bottom:1px solid #1c2a3a; font-size:0.7rem; letter-spacing:0.15em; text-transform:uppercase; color:#4b6280; display:flex; align-items:center; gap:8px; }
    .live-dot { width:7px; height:7px; border-radius:50%; background:#ef4444; animation:pulse 1.2s infinite; }
    @keyframes pulse { 0%,100% { opacity:1 } 50% { opacity:0.3 } }
    #cam-feed { width:100%; aspect-ratio:4/3; object-fit:cover; background:#060910; image-rendering:auto; }
    #landmarks-info { padding:12px 14px; flex:1; display:flex; flex-direction:column; gap:8px; }
    .info-row { display:flex; align-items:center; justify-content:space-between; font-size:0.75rem; }
    .info-label { color:#4b6280; }
    .info-val { color:#e2e8f0; font-size:0.72rem; }
    .badge { padding:2px 8px; border-radius:999px; font-size:0.65rem; }
    .badge-on { background:rgba(16,185,129,0.15); color:#10b981; }
    .badge-off { background:rgba(239,68,68,0.1); color:#ef4444; }
    .divider { height:1px; background:#1c2a3a; }
    #debug-log { padding:10px 14px; font-size:0.65rem; color:#4b6280; line-height:1.6; border-top:1px solid #1c2a3a; height:120px; overflow-y:auto; }
  </style>
</head>
<body>

<div id="topbar">
  <h1>SignBridge+ VRoid Controller</h1>
  <button id="loadBtn" onclick="loadVRM()">📁 Load VRM</button>
  <button onclick="toggleIdle()" style="background:#6b46c1; color:#fff; border:none; padding:7px 16px; border-radius:8px; cursor:pointer; font-weight:bold; font-family:monospace; font-size:0.8rem;">▶️ Idle</button>
  <span id="status">No model loaded</span>
</div>

<div id="main">
  <div id="bones-panel">
    <div id="bones-header">📦 VRM Bones</div>
    <div id="bones-list">Waiting for VRM...</div>
  </div>
  <div id="vrm-wrap">
    <canvas id="canvas"></canvas>
    <div id="translation">Waiting for signs...</div>
  </div>
  <div id="cam-panel">
    <div id="cam-header"><span class="live-dot"></span> Live Camera Feed</div>
    <img id="cam-feed" src="/video_feed" />
    <div id="landmarks-info">
      <div class="info-row"><span class="info-label">Face Tracking</span><span class="badge badge-off" id="face-badge">OFF</span></div>
      <div class="info-row"><span class="info-label">Pose / Arms</span><span class="badge badge-off" id="pose-badge">OFF</span></div>
      <div class="info-row"><span class="info-label">Fingers</span><span class="badge badge-off" id="finger-badge">OFF</span></div>
      <div class="divider"></div>
      <div class="info-row"><span class="info-label">Mouth Open</span><span class="info-val" id="mouth-val">0.00</span></div>
      <div class="info-row"><span class="info-label">Blink L / R</span><span class="info-val" id="blink-val">0.00 / 0.00</span></div>
      <div class="info-row"><span class="info-label">Right Arm</span><span class="info-val" id="rarm-val">—</span></div>
      <div class="info-row"><span class="info-label">Left Arm</span><span class="info-val" id="larm-val">—</span></div>
    </div>
    <div id="debug-log">Waiting for data...<br></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.socket.io/4.5.0/socket.io.min.js"></script>
<script type="importmap">
  { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.module.js" } }
</script>
<script type="module">
  import * as THREE from 'three';
  import { GLTFLoader } from 'https://cdn.jsdelivr.net/npm/three@0.128.0/examples/jsm/loaders/GLTFLoader.js';
  import { VRMLoaderPlugin, VRMUtils } from 'https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@1/lib/three-vrm.module.js';

  // Check if libraries loaded
  console.log('THREE version:', THREE.version);
  console.log('VRMLoaderPlugin:', VRMLoaderPlugin);
  console.log('VRMUtils:', VRMUtils);

  const canvas = document.getElementById('canvas');
  const wrap = document.getElementById('vrm-wrap');

  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
  renderer.setPixelRatio(window.devicePixelRatio);
  renderer.outputEncoding = THREE.sRGBEncoding;

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0d1117);

  const camera = new THREE.PerspectiveCamera(30, 1, 0.1, 20);
  camera.position.set(0, 1.3, 3.5);
  camera.lookAt(0, 1.0, 0);

  function resize() {
    const w = wrap.clientWidth, h = wrap.clientHeight;
    renderer.setSize(w, h);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
  }
  resize();
  window.addEventListener('resize', resize);

  scene.add(new THREE.AmbientLight(0xffffff, 0.8));
  const dir = new THREE.DirectionalLight(0xffffff, 0.8);
  dir.position.set(1, 2, 2);
  scene.add(dir);
  const fill = new THREE.DirectionalLight(0x8888ff, 0.3);
  fill.position.set(-1, 0, -1);
  scene.add(fill);

  let currentVRM = null;
  const loader = new GLTFLoader();
  
  // Register VRM plugin
  try {
    loader.register(parser => new VRMLoaderPlugin(parser));
    log('✓ VRM plugin registered');
  } catch (err) {
    log('❌ VRM plugin registration failed: ' + err.message);
    console.error('VRM Plugin Error:', err);
  }

  function log(msg) {
    const el = document.getElementById('debug-log');
    el.innerHTML += msg + '<br>';
    el.scrollTop = el.scrollHeight;
  }

  function logBones(bonesList) {
    const el = document.getElementById('bones-list');
    el.innerHTML = bonesList.map(b => '<div style="color:#10b981;">✓ ' + b + '</div>').join('');
  }

  window.loadVRM = function() {
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = '.vrm';
    input.onchange = (e) => {
      const file = e.target.files[0];
      if (!file) return;
      
      // Validate file size (VRMs should typically be < 500MB)
      if (file.size > 500 * 1024 * 1024) {
        log('❌ File too large (max 500MB)');
        document.getElementById('status').textContent = '❌ File too large';
        return;
      }
      
      document.getElementById('status').textContent = 'Loading ' + file.name + '...';
      log('Loading: ' + file.name);
      const url = URL.createObjectURL(file);
      
      // Add timeout for loading
      const loadTimeout = setTimeout(() => {
        log('❌ Loading timeout - VRM file may be corrupted');
        document.getElementById('status').textContent = '❌ Loading timeout';
        URL.revokeObjectURL(url);
      }, 30000);
      
      loader.load(url,
        (gltf) => {
          clearTimeout(loadTimeout);
          
          // Debug logging
          log('📦 GLTF loaded. Checking userData...');
          log('userData keys: ' + Object.keys(gltf.userData || {}).join(', '));
          
          const vrm = gltf.userData.vrm;
          if (!vrm) { 
            log('⚠️ userData.vrm is null. Checking gltf structure...');
            log('GLTF keys: ' + Object.keys(gltf).join(', '));
            
            // Try alternative extraction
            if (gltf.scene) {
              log('✓ Scene exists');
            }
            if (gltf.animations) {
              log('✓ Has ' + gltf.animations.length + ' animations');
            }
            
            log('❌ VRM plugin failed to parse - possible invalid VRM format'); 
            document.getElementById('status').textContent = '❌ Invalid VRM file';
            URL.revokeObjectURL(url);
            return; 
          }
          
          log('✓ VRM data found!');
          
          // Validate humanoid structure
          if (!vrm.humanoid) {
            log('❌ VRM missing humanoid structure');
            document.getElementById('status').textContent = '❌ Invalid humanoid';
            URL.revokeObjectURL(url);
            return;
          }
          
          log('✓ Humanoid structure validated');

          if (currentVRM) {
            scene.remove(currentVRM.scene);
            VRMUtils.deepDispose(currentVRM.scene);
          }
          currentVRM = vrm;
          
          try {
            // Step 1: Remove unnecessary vertices
            try {
              log('⏳ Step 1: Removing unnecessary vertices...');
              VRMUtils.removeUnnecessaryVertices(vrm.scene);
              log('✓ Vertices optimized');
            } catch (e) {
              log('⚠️ Vertex optimization failed: ' + e.message + ' (continuing anyway)');
            }
            
            // Step 2: Combine skeletons
            try {
              log('⏳ Step 2: Combining skeletons...');
              VRMUtils.combineSkeletons(vrm.scene);
              log('✓ Skeletons combined');
            } catch (e) {
              log('⚠️ Skeleton combine failed: ' + e.message + ' (continuing anyway)');
            }
            
            // Step 3: Configure scene
            log('⏳ Step 3: Configuring scene...');
            vrm.scene.traverse((obj) => {
              obj.frustumCulled = false;
            });
            // Rotate 180 degrees so model faces camera
            vrm.scene.rotation.y = Math.PI;
            scene.add(vrm.scene);
            log('✓ Scene configured (rotated 180°)');
            
            document.getElementById('status').textContent = '✅ ' + file.name;
            log('✅ Loaded: ' + file.name);
          } catch (err) {
            log('❌ Critical processing error: ' + err.message);
            log('Stack: ' + (err.stack || 'N/A').split('\n')[1]);
            document.getElementById('status').textContent = '❌ Processing failed';
            console.error('Full error:', err);
          }
          
          URL.revokeObjectURL(url);
          
          log('⏳ Settling model (wait 1s)...');
          setTimeout(() => {
            log('🎬 Starting idle animation...');
            enableIdleAnimation();
          }, 1000);
          
          // Debug: log available bones
          const bones = vrm.humanoid?.humanBones;
          if (bones) {
            const boneNames = Object.keys(bones);
            logBones(boneNames);
            log('📦 VRM has ' + boneNames.length + ' bones');
          }
        },
        (progress) => {
          const pct = Math.round(progress.loaded / (progress.total || 1) * 100);
          if (pct < 100) {
            document.getElementById('status').textContent = 'Loading... ' + pct + '%';
          } else {
            document.getElementById('status').textContent = 'Parsing VRM...';
            log('📊 File loaded (100%). Parsing VRM data...');
          }
        },
        (err) => {
          clearTimeout(loadTimeout);
          document.getElementById('status').textContent = '❌ Failed';
          log('❌ Load Error: ' + err.message);
          if (err.stack) {
            log('Stack: ' + err.stack.split('\n')[0]);
          }
          URL.revokeObjectURL(url);
          console.error('Full VRM Load Error:', err);
        }
      );
    };
    input.click();
  };

  const fingerBones = [
    'rightIndexProximal', 'rightIndexIntermediate', 'rightIndexDistal',
    'rightMiddleProximal', 'rightMiddleIntermediate', 'rightMiddleDistal',
    'rightRingProximal', 'rightRingIntermediate', 'rightRingDistal',
    'rightLittleProximal', 'rightLittleIntermediate', 'rightLittleDistal',
    'rightThumbProximal', 'rightThumbMetacarpal', 'rightThumbDistal',
    'leftIndexProximal', 'leftIndexIntermediate', 'leftIndexDistal',
    'leftMiddleProximal', 'leftMiddleIntermediate', 'leftMiddleDistal',
    'leftRingProximal', 'leftRingIntermediate', 'leftRingDistal',
    'leftLittleProximal', 'leftLittleIntermediate', 'leftLittleDistal',
    'leftThumbProximal', 'leftThumbMetacarpal', 'leftThumbDistal',
  ];

  // Map server finger names to VRM bone names
  const fingerBoneMap = {
    'rightIndexProximal': 'rightIndexProximal', 'rightIndexIntermediate': 'rightIndexIntermediate', 'rightIndexDistal': 'rightIndexDistal',
    'rightMiddleProximal': 'rightMiddleProximal', 'rightMiddleIntermediate': 'rightMiddleIntermediate', 'rightMiddleDistal': 'rightMiddleDistal',
    'rightRingProximal': 'rightRingProximal', 'rightRingIntermediate': 'rightRingIntermediate', 'rightRingDistal': 'rightRingDistal',
    'rightLittleProximal': 'rightLittleProximal', 'rightLittleIntermediate': 'rightLittleIntermediate', 'rightLittleDistal': 'rightLittleDistal',
    'rightThumbProximal': 'rightThumbProximal', 'rightThumbMetacarpal': 'rightThumbMetacarpal', 'rightThumbDistal': 'rightThumbDistal',
    'leftIndexProximal': 'leftIndexProximal', 'leftIndexIntermediate': 'leftIndexIntermediate', 'leftIndexDistal': 'leftIndexDistal',
    'leftMiddleProximal': 'leftMiddleProximal', 'leftMiddleIntermediate': 'leftMiddleIntermediate', 'leftMiddleDistal': 'leftMiddleDistal',
    'leftRingProximal': 'leftRingProximal', 'leftRingIntermediate': 'leftRingIntermediate', 'leftRingDistal': 'leftRingDistal',
    'leftLittleProximal': 'leftLittleProximal', 'leftLittleIntermediate': 'leftLittleIntermediate', 'leftLittleDistal': 'leftLittleDistal',
    'leftThumbProximal': 'leftThumbProximal', 'leftThumbMetacarpal': 'leftThumbMetacarpal', 'leftThumbDistal': 'leftThumbDistal',
  };

  const socket = io();
  const tmpQuat = new THREE.Quaternion();
  let fingerDebugLogged = false;
  
  const leftFingers = [
  'leftIndexProximal',
  'leftIndexIntermediate',
  'leftIndexDistal',
  'leftMiddleProximal',
  'leftMiddleIntermediate',
  'leftMiddleDistal',
  'leftRingProximal',
  'leftRingIntermediate',
  'leftRingDistal',
  'leftLittleProximal',
  'leftLittleIntermediate',
  'leftLittleDistal',
  'leftThumbProximal',
  'leftThumbMetacarpal',
  'leftThumbDistal',
];

const rightFingers = [
  'rightIndexProximal',
  'rightIndexIntermediate',
  'rightIndexDistal',
  'rightMiddleProximal',
  'rightMiddleIntermediate',
  'rightMiddleDistal',
  'rightRingProximal',
  'rightRingIntermediate',
  'rightRingDistal',
  'rightLittleProximal',
  'rightLittleIntermediate',
  'rightLittleDistal',
  'rightThumbProximal',
  'rightThumbMetacarpal',
  'rightThumbDistal',
];



function resolveBoneNode(boneName) {
  if (!currentVRM?.humanoid) return null;
  return (
    currentVRM.humanoid.getNormalizedBoneNode(boneName) ||
    currentVRM.humanoid?.humanBones?.[boneName]?.node ||
    null
  );
}

function rotateBone(boneName, quatArray, damp = 0.5, flip = { x: 1, y: 1, z: 1 }) {
  if (!currentVRM?.humanoid || !quatArray) return;

  const bone = resolveBoneNode(boneName);
  if (!bone) {
    // Only log non-finger bones (they're critical)
    if (!boneName.includes('Proximal') && !boneName.includes('Intermediate') && !boneName.includes('Distal')) {
      console.warn(`⚠️ Bone not found: ${boneName}`);
    }
    return;
  }

  let x, y, z, w;
  if (Array.isArray(quatArray) && quatArray.length === 4) {
    [x, y, z, w] = quatArray;
  } else if (quatArray && typeof quatArray === 'object') {
    ({ x, y, z, w } = quatArray);
  } else {
    return;
  }

  x *= flip.x;
  y *= flip.y;
  z *= flip.z;

  tmpQuat.set(x, y, z, w);
  tmpQuat.normalize();
  bone.quaternion.slerp(tmpQuat, damp);
}

socket.on('pose', (data) => {
  // Disable idle animation when real pose data arrives
  idleEnabled = false;

  const hasFace = !!data.blendshapes;
  const hasPose = !!data.RightUpperArm;
  const hasFingers = !!data.rightIndexProximal || !!data.leftIndexProximal;
  
  // Debug: Log available hand bones first time fingers detected
  if (hasFingers && !fingerDebugLogged && currentVRM?.humanoid) {
    fingerDebugLogged = true;
    const allBones = Object.keys(currentVRM.humanoid.humanBones || {});
    const fingerBonesInVRM = allBones.filter(b => b.includes('Index') || b.includes('Middle') || b.includes('Ring') || b.includes('Little') || b.includes('Thumb'));
    console.log('🤚 Hand bones in VRM:', fingerBonesInVRM);
    console.log('📨 Received finger data keys:', Object.keys(data).filter(k => k.includes('Proximal') || k.includes('Intermediate') || k.includes('Distal')));
  }

  document.getElementById('face-badge').className = 'badge ' + (hasFace ? 'badge-on' : 'badge-off');
  document.getElementById('face-badge').textContent = hasFace ? 'ON' : 'OFF';
  document.getElementById('pose-badge').className = 'badge ' + (hasPose ? 'badge-on' : 'badge-off');
  document.getElementById('pose-badge').textContent = hasPose ? 'ON' : 'OFF';
  document.getElementById('finger-badge').className = 'badge ' + (hasFingers ? 'badge-on' : 'badge-off');
  document.getElementById('finger-badge').textContent = hasFingers ? 'ON' : 'OFF';

  if (data.blendshapes) {
    document.getElementById('mouth-val').textContent = (data.blendshapes.A || 0).toFixed(2);
    document.getElementById('blink-val').textContent =
      (data.blendshapes.Blink_L || 0).toFixed(2) + ' / ' + (data.blendshapes.Blink_R || 0).toFixed(2);
  }
  if (data.RightUpperArm) {
    const [x, y] = data.RightUpperArm;
    document.getElementById('rarm-val').textContent = x.toFixed(2) + ', ' + y.toFixed(2);
  }
  if (data.LeftUpperArm) {
    const [x, y] = data.LeftUpperArm;
    document.getElementById('larm-val').textContent = x.toFixed(2) + ', ' + y.toFixed(2);
  }

  if (!currentVRM || !currentVRM.humanoid) return;

  rotateBone('leftUpperArm', data.LeftUpperArm, 0.35);
  rotateBone('leftLowerArm', data.LeftLowerArm, 0.35);
  rotateBone('rightUpperArm', data.RightUpperArm, 0.35);
  rotateBone('rightLowerArm', data.RightLowerArm, 0.35);
  rotateBone('neck', data.Head, 0.25, { x: 0.7, y: 0.7, z: 0.7 });

  leftFingers.forEach((bone) => {
    if (data[bone]) {
      rotateBone(bone, data[bone], 0.45);
    }
  });

  rightFingers.forEach((bone) => {
    if (data[bone]) {
      rotateBone(bone, data[bone], 0.45);
    }
  });

  if (data.blendshapes && currentVRM.expressionManager) {
    const em = currentVRM.expressionManager;
    try { em.setValue('aa', data.blendshapes.A || 0); } catch (e) {}
    try { em.setValue('blinkLeft', data.blendshapes.Blink_L || 0); } catch (e) {}
    try { em.setValue('blinkRight', data.blendshapes.Blink_R || 0); } catch (e) {}
  }
});

socket.on('translation', (data) => {
  document.getElementById('translation').textContent = data.text;
});

  const clock = new THREE.Clock();
  let idleEnabled = true;
  let renderCount = 0;
  
  function applyIdleAnimation(vrm, time) {
    if (!vrm || !idleEnabled) return;
    
    const bones = vrm.humanoid?.humanBones;
    if (!bones) return;
    
    // Gentle sway on spine
    const swayAngle = Math.sin(time * 0.5) * 0.1;
    if (bones.spine) {
      bones.spine.node.quaternion.setFromAxisAngle(new THREE.Vector3(0, 1, 0), swayAngle);
      bones.spine.node.updateMatrix();
      bones.spine.node.updateMatrixWorld(true);
    }
    
    // Wave right arm up and down
    const armAngle = Math.sin(time * 0.7) * 0.5;
    if (bones.rightUpperArm) {
      const quat = new THREE.Quaternion();
      quat.setFromAxisAngle(new THREE.Vector3(1, 0, 0), armAngle);
      bones.rightUpperArm.node.quaternion.copy(quat);
      bones.rightUpperArm.node.updateMatrix();
      bones.rightUpperArm.node.updateMatrixWorld(true);
    }
    
    // Head look around
    const headAngle = Math.sin(time * 0.3) * 0.15;
    if (bones.head) {
      const quat = new THREE.Quaternion();
      quat.setFromAxisAngle(new THREE.Vector3(0, 1, 0), headAngle);
      bones.head.node.quaternion.copy(quat);
      bones.head.node.updateMatrix();
      bones.head.node.updateMatrixWorld(true);
    }
  }
  
  function disableIdleAnimation() {
    idleEnabled = false;
    log('⏹️ Idle animation disabled (pose tracking active)');
  }
  
  function enableIdleAnimation() {
    idleEnabled = true;
    log('▶️ Idle animation enabled');
  }
  
  function toggleIdleAnimation() {
    idleEnabled = !idleEnabled;
    log(idleEnabled ? '▶️ Idle ON' : '⏹️ Idle OFF');
  }
  
  window.toggleIdle = toggleIdleAnimation;
  
  function animate() {
    requestAnimationFrame(animate);
    const delta = clock.getDelta();
    const elapsed = clock.getElapsedTime();
    
    if (currentVRM) {
      if (idleEnabled) {
  applyIdleAnimation(currentVRM, elapsed);
}
 currentVRM.scene.updateMatrixWorld(true);     

currentVRM.update(delta);
    }
    renderer.render(scene, camera);
    renderCount++;
    
    // Log performance every 300 frames
    if (renderCount % 300 === 0) {
      const fps = Math.round(1 / delta);
      if (fps < 30) {
        console.warn(`⚠️ Low FPS: ${fps}`);
      }
    }
  }
  animate();
</script>
</body>
</html>
